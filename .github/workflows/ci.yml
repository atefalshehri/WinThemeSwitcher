name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Read-only: no workflow in this repo writes releases or pushes anything.
# Releases are created only by scripts/release.ps1 on the maintainer's
# machine (the signing key is local), gated on this workflow passing.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # A hung step (e.g. a test stuck on a dialog) would otherwise run for
    # GitHub's 6-hour default while release.ps1's CI gate waits for it.
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned by commit SHA (tags are mutable).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # dtolnay/rust-toolchain has no version tags; pin a commit on its
      # master branch (the README requires master history — other branches'
      # commits get garbage-collected) and select the toolchain by input.
      - id: toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml') }}

      - name: Build (release)
        run: cargo build --release --locked

      # The .cargo/config.toml linker hardening must reach the PE (no
      # VCRUNTIME140 import, DependentLoadFlags 0x800) — fail if it's lost.
      - name: Verify linker hardening
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-hardening.ps1 -Exe target/release/win-theme-switcher.exe

      # Hard gate. The .cargo/config.toml linker flags apply here too.
      - name: Test
        run: cargo test --locked

      # Hard gates too. Clippy also lints the tests (--all-targets) and fails
      # on any compiler or clippy warning. The toolchain is the floating
      # stable, so a new Rust release can add a lint that fails this step with
      # no code change: rustup update stable locally to see it, then fix it or
      # #[allow] it with a reason. Never move these flags into RUSTFLAGS -
      # that replaces the .cargo/config.toml hardening.
      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings

  # Dependency audit, configured by deny.toml: RustSec advisories, licenses,
  # banned or duplicated crates and crate sources, for the graph the
  # x86_64-pc-windows-msvc build uses (cargo-deny reads it from Linux just as
  # well). A new advisory can fail this job with no code change - deny.toml
  # says what to do.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # cargo-deny comes from its GitHub release, checked against this SHA-256 -
    # not through its Docker action, which downloads the binary without a
    # check and runs it with a token that can write the Actions cache. To bump
    # it, take the new version's x86_64-unknown-linux-musl.tar.gz digest from
    # the release (gh api repos/EmbarkStudios/cargo-deny/releases/tags/<v>).
    env:
      DENY_VERSION: "0.20.2"
      DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The build job's toolchain (cargo-deny runs cargo metadata).
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: stable

      - name: Install cargo-deny
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cargo-deny.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$DENY_SHA256  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/cargo-deny"
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP/cargo-deny" --strip-components=1

      - name: cargo deny check
        run: '"$RUNNER_TEMP/cargo-deny/cargo-deny" --all-features --locked check'
