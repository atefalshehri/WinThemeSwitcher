[package]
name = "win-theme-switcher"
version = "0.5.0"
edition = "2021"
description = "Lightweight Windows tray app that auto-switches theme at sunrise and sunset"
license = "MIT"

[[bin]]
name = "win-theme-switcher"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
sun-times = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.25"
winit = "0.30"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
    # RegisterClassW/WNDCLASSW (wake listener window) are cfg-gated on GDI
    # (WNDCLASSW has an HBRUSH field). Until v0.5.0 this was enabled only
    # transitively, by tray-icon 0.19 sharing our windows-sys 0.59.
    "Win32_Graphics_Gdi",
]

[dependencies.windows]
version = "0.59"
features = [
    "Devices_Geolocation",
    "Foundation",
    "Win32_System_Com",
]

# The polar schedule-contract sweep evaluates schedule() tens of thousands of
# times; unoptimized it takes minutes. Debug assertions stay on.
[profile.test]
opt-level = 2

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
