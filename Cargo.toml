[package]
name = "win-theme-switcher"
version = "0.5.1"
edition = "2021"
description = "Lightweight Windows tray app that auto-switches theme at sunrise and sunset"
license = "MIT"

[[bin]]
name = "win-theme-switcher"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
sun-times = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.25"
winit = "0.30"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    # Tests only: the manifest test reads the process's DPI awareness.
    "Win32_UI_HiDpi",
    "Win32_Graphics_Dwm",
    # RegisterClassW/WNDCLASSW (wake listener window) are cfg-gated on GDI
    # (WNDCLASSW has an HBRUSH field). tray-icon and muda share this
    # windows-sys (0.61) and enable Gdi and other features on it, so the
    # build would pass without some entries here. Keep the list complete
    # on its own: until v0.5.0 Gdi came only from tray-icon 0.19, and the
    # build broke when tray-icon 0.25 moved to another windows-sys.
    "Win32_Graphics_Gdi",
]

[dependencies.windows]
version = "0.59"
features = [
    "Devices_Geolocation",
    "Foundation",
    "Win32_System_Com",
]

# The polar schedule-contract sweep evaluates schedule() tens of thousands of
# times; unoptimized it takes minutes. Debug assertions stay on.
[profile.test]
opt-level = 2

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
